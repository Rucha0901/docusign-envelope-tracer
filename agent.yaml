spec_version: "0.1.0"
name: docusign-envelope-tracer
version: 1.0.0
description: E-signature envelope lifecycle tracking, automated signer reminder scheduling, and completion certificate auditing.
author: "Rucha Salpure"
license: MIT
model:
  preferred: claude-opus-4-6
  fallback:
    - claude-sonnet-4-5-20250929
  constraints:
    temperature: 0.2
    max_tokens: 4096
skills:
  - audit-trail-certificate-check
tools: []
delegation:
  mode: auto
runtime:
  max_turns: 50
  timeout: 300
compliance:
  risk_tier: standard
  frameworks: []
tags:
  - compliance
  - autonomous-agent
  - opengap-verified
metadata:
  repository: "https://github.com/Rucha0901/docusign-envelope-tracer"
